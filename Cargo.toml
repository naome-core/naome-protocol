[package]
name = "naome-protocol"
default-run = "nao"
version = "0.1.8"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/naome-core/naome-protocol"
description = "An offline, content-addressed research evidence archive and evaluator"
readme = "README.md"
include = ["src/**", "spec/**", "tests/**", "README.md", "LICENSE", "requirements-search*.txt"]

[features]
default = ["cli", "semantic-search"]
semantic-search = ["dep:base64"]
cli = ["dep:clap", "dep:getrandom", "dep:tempfile"]

[[bin]]
name = "nao"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1"
base64 = { version = "0.22", optional = true }
caseless = "0.2.2"
clap = { version = "4", features = ["derive"], optional = true }
ed25519-dalek = "2"
getrandom = { version = "0.3", optional = true }
hex = "0.4"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = { version = "3", optional = true }
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
