name: Full Cargo CI

on:
  workflow_dispatch:
    inputs:
      model_search:
        description: Run offline search qualification with EmbeddingGemma 2
        type: boolean
        default: true
  workflow_call:
    inputs:
      model_search:
        type: boolean
        default: false
      reuse_platform_debug:
        description: The caller separately requires the macOS and Windows debug jobs.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: full-cargo-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  platform:
    name: Cargo (${{ matrix.name }}, ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        profile: [test, release]
        runner: [ubuntu-22.04, macos-15, windows-2025]
        exclude: ${{ fromJSON(inputs.reuse_platform_debug && '[{"runner":"macos-15","profile":"test"},{"runner":"windows-2025","profile":"test"}]' || '[]') }}
        include:
          - runner: ubuntu-22.04
            name: Linux x86_64
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            name: macOS ARM64
            target: aarch64-apple-darwin
          - runner: windows-2025
            name: Windows x86_64
            target: x86_64-pc-windows-msvc
    uses: ./.github/workflows/rust-tests.yml
    with:
      runner: ${{ matrix.runner }}
      profile: ${{ matrix.profile }}
      package_target: ${{ matrix.profile == 'release' && matrix.target || '' }}
      model_search: ${{ matrix.profile == 'release' && inputs.model_search }}

  result:
    name: Full Cargo results
    if: ${{ always() }}
    needs: platform
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out gate implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require all platform runs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci/check_results.py platform
      - name: Reject workflow cancellation
        if: ${{ always() && cancelled() }}
        run: exit 1
