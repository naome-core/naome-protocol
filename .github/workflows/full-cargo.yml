name: Full Cargo CI

on:
  workflow_dispatch:
    inputs:
      model_search:
        description: Run offline search qualification with EmbeddingGemma 2
        type: boolean
        default: true
  workflow_call:
    inputs:
      model_search:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: full-cargo-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  linux_tests:
    name: Cargo (Linux x86_64, ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        profile: [test, release]
    uses: ./.github/workflows/rust-tests.yml
    with:
      runner: ubuntu-24.04
      profile: ${{ matrix.profile }}

  macos_tests:
    name: Cargo (macOS ARM64, ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        profile: [test, release]
    uses: ./.github/workflows/rust-tests.yml
    with:
      runner: macos-15
      profile: ${{ matrix.profile }}

  model_search:
    name: EmbeddingGemma 2 search qualification
    if: ${{ inputs.model_search }}
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.12'
      - name: Install the qualified inference runtime
        run: |
          python -m pip install 'torch==2.15.0' 'torchvision==0.29.2' \
            'transformers==5.24.0' 'sentence-transformers==6.3.0' 'huggingface-hub==1.33.0' \
            'numpy==2.5.5' 'pillow==13.0.0' 'av==19.0.2' 'pypdfium2==5.15.2'
      - name: Measure multilingual and media search
        run: python tools/ci/search_qualification.py

  result:
    name: Full Cargo results
    if: ${{ always() }}
    needs: [linux_tests, macos_tests, model_search]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out gate implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require both complete platform matrices
        env:
          NEEDS: ${{ toJSON(needs) }}
          MODEL_SEARCH: ${{ inputs.model_search }}
        run: |
          if [ "$MODEL_SEARCH" = true ]; then
            python3 tools/ci/check_results.py linux_tests macos_tests model_search
          else
            python3 tools/ci/check_results.py linux_tests macos_tests
          fi
      - name: Reject workflow cancellation
        if: ${{ always() && cancelled() }}
        run: exit 1
