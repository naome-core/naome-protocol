name: WinGet

on:
  pull_request:
    paths:
      - .github/workflows/winget.yml
      - packaging/winget/**
      - tools/ci/test_winget.ps1
  push:
    branches:
      - main
    paths:
      - .github/workflows/winget.yml
      - packaging/winget/**
      - tools/ci/test_winget.ps1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: WinGet install and upgrade (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the portable package
        shell: pwsh
        run: ./tools/ci/test_winget.ps1
