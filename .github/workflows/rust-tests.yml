name: Rust tests

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      profile:
        required: true
        type: string
      package_target:
        type: string
        default: ''
      model_search:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
  NAOME_TEST_PROFILE: ${{ inputs.profile }}

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Full workspace
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.model_search && 60 || 30 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify checkout, profile, and pinned toolchain
        run: |
          case "$NAOME_TEST_PROFILE" in
            test|release) ;;
            *) echo "Unsupported test profile: $NAOME_TEST_PROFILE"; exit 1 ;;
          esac
          git show --no-patch --format='commit=%H%ntree=%T%nparents=%P' HEAD
          rustup show active-toolchain
          rustup component list --installed
          rustc --version --verbose
          cargo --version --verbose

      - name: Select the native MSVC target explicitly
        if: ${{ runner.os == 'Windows' }}
        run: echo 'CARGO_BUILD_TARGET=x86_64-pc-windows-msvc' >> "$GITHUB_ENV"

      - name: Cache Cargo downloads
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: Check with Clippy
        if: ${{ inputs.profile == 'test' }}
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test the independent protocol library
        run: cargo test -p naome-protocol --no-default-features --profile "$NAOME_TEST_PROFILE" --locked

      - name: Build nao from locked dependencies
        run: cargo build --workspace --profile "$NAOME_TEST_PROFILE" --locked

      - name: Run protocol and conformance tests
        run: cargo test --workspace --profile "$NAOME_TEST_PROFILE" --all-features --all-targets --locked --no-fail-fast

      - name: Measure 512 successive archive changes and verify historical reads
        if: ${{ inputs.package_target != '' }}
        env:
          NAOME_SAMPLE_DIR: ${{ runner.temp }}/custody-history
          NAOME_SAMPLE_SIZE: '512'
          NAOME_SAMPLE_PHASE: history
        run: |
          mkdir -p "$NAOME_SAMPLE_DIR"
          cargo test --lib --release --locked -- store::custody::tests::qualification_sample --exact --ignored --nocapture

      - name: Run documentation tests
        run: cargo test --workspace --doc --all-features --locked

      - name: Set up Python for release verification
        if: ${{ inputs.package_target != '' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'

      - name: Rebuild and verify the whitepaper
        if: ${{ inputs.package_target == 'x86_64-unknown-linux-gnu' }}
        run: python tools/ci/whitepaper.py

      - name: Install the qualified inference runtime
        if: ${{ inputs.model_search }}
        run: |
          if [[ "$RUNNER_OS" != macOS ]]; then
            python -m pip install --only-binary=:all: --no-deps --index-url https://download.pytorch.org/whl/cpu -r requirements-search-torch.txt
          fi
          python -m pip install -r requirements-search.txt
          python -m pip check
          python tools/ci/audit_search_runtime.py

      - name: Package and test the release download
        if: ${{ inputs.package_target != '' }}
        env:
          PACKAGE_TARGET: ${{ inputs.package_target }}
          MODEL_SEARCH: ${{ inputs.model_search }}
        run: |
          args=()
          if [[ "$MODEL_SEARCH" == true ]]; then
            args+=(--model)
          fi
          python tools/ci/package_release.py "$PACKAGE_TARGET" "${args[@]}"

      - name: Verify and stage the source package and whitepaper
        if: ${{ inputs.package_target == 'x86_64-unknown-linux-gnu' }}
        run: |
          cargo package --locked
          mkdir -p target/source-distribution
          cp target/package/naome-protocol-*.crate spec/research-evidence-protocol.pdf target/source-distribution/

      - name: Upload the verified native release files
        if: ${{ inputs.package_target != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nao-${{ inputs.package_target }}
          path: target/distribution/*
          if-no-files-found: error
          compression-level: 0

      - name: Upload the source package and whitepaper
        if: ${{ inputs.package_target == 'x86_64-unknown-linux-gnu' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nao-source
          path: target/source-distribution/*
          if-no-files-found: error
          compression-level: 0

      - name: Verify tracked sources are unchanged
        run: git diff --exit-code HEAD
