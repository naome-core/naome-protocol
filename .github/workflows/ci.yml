name: CI

on:
  merge_group:
    types:
      - checks_requested
    branches:
      - main
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup component list --installed
          rustc --version --verbose
          cargo --version --verbose

      - name: Validate workflow syntax and expressions
        run: python3 tools/ci/check_workflows.py

      - name: Audit locked dependencies
        run: python3 tools/ci/audit_dependencies.py

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

  linux_tests:
    name: Cargo (Linux x86_64)
    uses: ./.github/workflows/rust-tests.yml
    with:
      runner: ubuntu-24.04
      profile: test

  macos_tests:
    name: Cargo (macOS ARM64)
    uses: ./.github/workflows/rust-tests.yml
    with:
      runner: macos-15
      profile: test

  windows_tests:
    name: Cargo (Windows x86_64)
    uses: ./.github/workflows/rust-tests.yml
    with:
      runner: windows-2025
      profile: test

  release:
    name: Release qualification
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'task/release-') }}
    uses: ./.github/workflows/full-cargo.yml
    with:
      model_search: true
      reuse_platform_debug: true

  linux:
    name: Rust platform (Linux x86_64)
    if: ${{ always() }}
    needs: linux_tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the platform tests to succeed
        env:
          PLATFORM_RESULT: ${{ needs.linux_tests.result }}
        run: test "$PLATFORM_RESULT" = success
      - name: Reject workflow cancellation
        if: ${{ always() && cancelled() }}
        run: exit 1

  macos:
    name: Rust platform (macOS ARM64)
    if: ${{ always() }}
    needs: macos_tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the platform tests to succeed
        env:
          PLATFORM_RESULT: ${{ needs.macos_tests.result }}
        run: test "$PLATFORM_RESULT" = success
      - name: Reject workflow cancellation
        if: ${{ always() && cancelled() }}
        run: exit 1

  required:
    name: Rust CI
    if: ${{ always() }}
    needs: [quality, linux, macos, windows_tests, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out gate implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
          RELEASE_REQUIRED: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'task/release-') }}
        run: |
          if [ "$RELEASE_REQUIRED" = true ]; then
            python3 tools/ci/check_results.py quality linux macos windows_tests release
          else
            python3 tools/ci/check_results.py quality linux macos windows_tests release=skipped
          fi
      - name: Reject workflow cancellation
        if: ${{ always() && cancelled() }}
        run: exit 1
